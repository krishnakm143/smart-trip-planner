services:
  - type: web
    name: smart-trip-planner-backend
    env: node
    plan: free
    buildCommand: npm install && cd server && npm ci --omit=dev
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 4100
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAPS_PROVIDER
        value: google
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: AUTH_PROVIDER
        value: supabase
      - key: TRIP_STORAGE
        value: supabase
    healthCheckPath: /api/v1/health
    autoDeploy: true
    region: oregon
    branch: main