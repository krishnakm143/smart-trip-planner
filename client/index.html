<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan a day-wise itinerary and an honest budget for destinations across India & beyond." />
    <meta name="theme-color" content="#0e5e5a" />
    <!-- Preconnect to external API providers for faster resource loading -->
    <link rel="preconnect" href="https://api.groq.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="preconnect" href="https://nominatim.openstreetmap.org" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- PWA manifest -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>Smart Trip Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Service worker management: register in production, clean up in dev -->
    <script>
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const r of registrations) r.unregister()
          })
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('%BASE_URL%sw.js').catch(() => {})
          })
        }
      }
    </script>
  </body>
</html>
